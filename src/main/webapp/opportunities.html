<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opportunities | E-Sukarelawan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=36">
</head>
<body data-page="opportunities">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="workspace">
      <header class="topbar" id="topbar"></header>
      <section class="page-heading split-heading">
        <div><h1>Volunteer opportunities</h1><p id="opportunityIntro">Browse programmes and apply to volunteer.</p></div>
        <button class="btn primary admin-only" type="button" id="showOpportunityForm">Create opportunity</button>
      </section>
      <form class="panel form-card admin-only hidden" id="opportunityForm">
        <div class="panel-head"><div><h2 id="opportunityFormTitle">New opportunity</h2><p>Publish a programme for student volunteers.</p></div></div>
        <div class="panel-body form-grid">
          <label class="field wide">Event name<input id="eventName" name="eventName" required></label>
          <label class="field">NGO<input id="ngoName" name="ngoName" required></label>
          <label class="field">Date<input id="eventDate" name="eventDate" type="date" required></label>
          <label class="field">Seats<input id="eventSeats" name="eventSeats" type="number" min="1" required></label>
          <label class="field">Status<select id="eventStatus" name="eventStatus"><option value="open">Open</option><option value="limited">Limited</option><option value="closed">Closed</option></select></label>
          <label class="field wide">Location<input id="eventLocation" name="eventLocation" required></label>
          <label class="field">Category<select id="eventCategory" name="eventCategory"><option>Environment</option><option>Food Aid</option><option>Education</option><option>Health</option><option>Community</option></select></label>
          <div class="form-actions"><button class="btn primary" id="saveOpportunityBtn" type="submit">Create</button><button class="btn secondary" id="cancelEditBtn" type="button">Cancel</button></div>
        </div>
      </form>
      <section class="panel">
        <div class="toolbar">
          <label class="search"><span>âŒ•</span><input id="globalSearch" type="search" placeholder="Search event, NGO, or location"></label>
          <div class="filter-group">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="open" type="button">Open</button>
            <button class="filter-btn" data-filter="limited" type="button">Limited</button>
            <button class="filter-btn" data-filter="closed" type="button">Closed</button>
          </div>
          <span class="muted" id="resultCount"></span>
        </div>
        <div class="opportunity-list" id="opportunityList"></div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js?v=36"></script>
</body>
</html>
